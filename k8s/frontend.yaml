apiVersion: apps/v1
kind: Deployment
metadata:
  name: kora-frontend
  labels: { app: kora-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: kora-frontend }
  template:
    metadata:
      labels: { app: kora-frontend }
    spec:
      containers:
      - name: kora-frontend
        image: kora-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits:   { memory: "128Mi", cpu: "200m" }
---
apiVersion: v1
kind: Service
metadata:
  name: kora-frontend
spec:
  selector: { app: kora-frontend }
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer