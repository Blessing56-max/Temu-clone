name: Kora CI/CD with K8s Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kora-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build & Containerize Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build backend (Maven)
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t kora-backend:${{ github.sha }} -f backend/Dockerfile backend

      - uses: actions/upload-artifact@v4
        with:
          name: kora-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  frontend:
    name: Build & Containerize Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker image
        run: docker build -t kora-frontend:${{ github.sha }} -f frontend/Dockerfile frontend

  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: List manifests
        run: ls -la k8s/

      - name: Dry-run apply
        run: kubectl apply --dry-run=client -f k8s/ -o yaml >/dev/null

      - name: K8s ready
        run: echo "K8s manifests validated - ready for cluster apply"

  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Notify Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "No RENDER_DEPLOY_HOOK set - skipping"
            exit 0
          fi

          curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Render deploy triggered"
