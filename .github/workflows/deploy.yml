name: Kora CI/CD with K8s Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Build & Containerize Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backend (Maven)
        run: cd backend && mvn clean package -DskipTests
      - name: Build Docker image
        run: docker build -t kora-backend:${{ github.sha }} ./backend
      - uses: actions/upload-artifact@v4
        with:
          name: kora-backend-jar
          path: backend/target/*.jar

  frontend:
    name: Build & Containerize Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        run: cd frontend && npm ci && npm run build
      - name: Build Docker image
        run: docker build -t kora-frontend:${{ github.sha }} ./frontend

  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: List manifests
        run: ls -la k8s/
      - name: Dry-run apply
        run: kubectl apply --dry-run=client -f k8s/ || true
      - name: K8s ready
        run: echo "K8s manifests validated - ready for cluster apply"

  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render deploy triggered"
          else
            echo "No RENDER_DEPLOY_HOOK set - skipping"
          fi